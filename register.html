<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"><title>Create account | CleanCity</title></head><body class="auth"><div class="auth-top"><a class="logo" href="index.html"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#16865A"/><path d="M7 14c0-4 3-7 8-7 0 5-3 8-7 8M7 19c2-4 4-6 7-8" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>CleanCity</a></div><main class="auth-main"><div class="auth-card"><h1>Create your account</h1><p>Report waste problems and follow them to resolution.</p>

<p class="alt">Already registered? <a href="login.html">Log in</a></p></div></main><script type="module" src="js/auth.js"></script></body></html>
