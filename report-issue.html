<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/forms.css"><title>Report an issue | CleanCity</title></head><body><header class="nav"><div class="wrap"><a class="logo" href="index.html"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#16865A"/><path d="M7 14c0-4 3-7 8-7 0 5-3 8-7 8M7 19c2-4 4-6 7-8" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>CleanCity</a><button class="menu" aria-label="Menu" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><ul><li><a href="user-dashboard.html">Dashboard</a></li><li><a href="my-complaints.html">My complaints</a></li><li><a href="awareness.html">Awareness</a></li><li class="notif"><button class="bell" id="bell" aria-expanded="false" aria-label="Notifications">Alerts <i id="ncount" hidden>0</i></button><div class="npanel" id="npanel" hidden></div></li><li><button class="logout" data-logout>Log out</button></li><li><a class="btn" href="report-issue.html">Report an issue</a></li></ul></div></header><main class="page"><div class="wrap">
<div class="page-head"><div><h1>Report a waste issue</h1><p>The more detail you give, the faster it can be handled.</p></div></div>
<form class="form panel" id="reportForm" novalidate><div class="grid">
<div class="field full"><label for="title">Complaint title</label><input id="title" type="text" maxlength="120" placeholder="Overflowing bin near the market gate"></div>
<div class="field"><label for="category">Waste category</label><select id="category"><option value="">Choose a category</option></select></div>
<div class="field"><label for="location">Location or area</label><input id="location" type="text" placeholder="Street, landmark or ward"></div>
<div class="field full"><label for="description">Description</label><textarea id="description" maxlength="2000" placeholder="What is the problem and how long has it been there?"></textarea></div>
<div class="field"><label for="city">City</label><input id="city" type="text"></div>
<div class="field"><label for="pin">PIN code</label><input id="pin" type="text" inputmode="numeric" maxlength="6"></div>
<div class="field"><label for="lat">Latitude (optional)</label><input id="lat" type="number" step="any"></div>
<div class="field"><label for="lng">Longitude (optional)</label><input id="lng" type="number" step="any"><button class="btn ghost small" type="button" id="geo">Use my location</button></div>
<div class="field full"><label>Photo (optional)</label><div class="drop" id="drop" tabindex="0" role="button"><b>Drop an image here or choose a file</b><br>JPG, PNG or WEBP, up to 5 MB</div><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
<div class="preview" id="preview"><img id="pimg" alt="Selected photo preview"><button type="button" id="remove">Remove</button></div><div class="bar" id="bar"><i id="barfill"></i></div></div></div>
<button class="btn" id="submit" type="submit" style="margin-top:8px">Submit complaint</button></form></div></main><script type="module" src="js/app.js"></script><script type="module" src="js/report.js"></script></body></html>
